naftiko: 1.0.0-alpha2
info:
  label: Acadia - Platform API — Employees
  description: 'Acadia - Platform API — Employees. 1 operations. Lead operation: Acadia List Employees. Self-contained Naftiko
    capability covering one Acadia business surface.'
  tags:
  - Acadia
  - Employees
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ACADIA_API_KEY: ACADIA_API_KEY
capability:
  consumes:
  - type: http
    namespace: platform-employees
    baseUri: https://api.acadia-software.com/v1
    description: Acadia - Platform API — Employees business capability. Self-contained, no shared references.
    resources:
    - name: employees
      path: /employees
      operations:
      - name: listemployees
        method: GET
        description: Acadia List Employees
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: role_id
          in: query
          type: string
          description: Filter employees by role identifier.
        - name: department
          in: query
          type: string
          description: Filter employees by department name.
        - name: page
          in: query
          type: integer
          description: Page number for pagination.
        - name: limit
          in: query
          type: integer
          description: Number of results per page.
    authentication:
      type: bearer
      token: '{{env.ACADIA_API_KEY}}'
  exposes:
  - type: rest
    namespace: platform-employees-rest
    port: 8080
    description: REST adapter for Acadia - Platform API — Employees. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/employees
      name: employees
      description: REST surface for employees.
      operations:
      - method: GET
        name: listemployees
        description: Acadia List Employees
        call: platform-employees.listemployees
        with:
          role_id: rest.role_id
          department: rest.department
          page: rest.page
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: platform-employees-mcp
    port: 9090
    transport: http
    description: MCP adapter for Acadia - Platform API — Employees. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: acadia-list-employees
      description: Acadia List Employees
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: platform-employees.listemployees
      with:
        role_id: tools.role_id
        department: tools.department
        page: tools.page
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
