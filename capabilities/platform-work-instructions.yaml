    namespace: platform-work-instructions
    baseUri: https://api.acadia-software.com/v1
    description: Acadia - Platform API — Work Instructions business capability. Self-contained, no shared references.
    resources:
    - name: work-instructions
      path: /work-instructions
      operations:
      - name: listworkinstructions
        method: GET
        description: Acadia List Work Instructions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: status
          in: query
          type: string
          description: Filter by publication status (draft, published, archived).
        - name: category
          in: query
          type: string
          description: Filter by work instruction category or department.
        - name: page
          in: query
          type: integer
          description: Page number for pagination.
        - name: limit
          in: query
          type: integer
          description: Number of results per page (max 100).
      - name: createworkinstruction
        method: POST
        description: Acadia Create Work Instruction
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: work-instructions-id
      path: /work-instructions/{id}
      operations:
      - name: getworkinstruction
        method: GET
        description: Acadia Get Work Instruction
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: Work instruction identifier.
          required: true
    authentication:
      type: bearer
      token: '{{env.ACADIA_API_KEY}}'
  exposes:
  - type: rest
    namespace: platform-work-instructions-rest
    port: 8080
    description: REST adapter for Acadia - Platform API — Work Instructions. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/work-instructions
      name: work-instructions
      description: REST surface for work-instructions.
      operations:
      - method: GET
        name: listworkinstructions
        description: Acadia List Work Instructions
        call: platform-work-instructions.listworkinstructions
        with:
          status: rest.status
          category: rest.category
          page: rest.page
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createworkinstruction
        description: Acadia Create Work Instruction
        call: platform-work-instructions.createworkinstruction
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/work-instructions/{id}
      name: work-instructions-id
      description: REST surface for work-instructions-id.
      operations:
      - method: GET
        name: getworkinstruction
        description: Acadia Get Work Instruction
        call: platform-work-instructions.getworkinstruction
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
