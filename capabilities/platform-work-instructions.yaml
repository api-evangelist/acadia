    port: 9090
    transport: http
    description: MCP adapter for Acadia - Platform API — Work Instructions. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: acadia-list-work-instructions
      description: Acadia List Work Instructions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: platform-work-instructions.listworkinstructions
      with:
        status: tools.status
        category: tools.category
        page: tools.page
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: acadia-create-work-instruction
      description: Acadia Create Work Instruction
      hints:
