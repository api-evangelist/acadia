naftiko: 1.0.0-alpha2
info:
  label: Acadia - Platform API — Work Instructions
  description: 'Acadia - Platform API — Work Instructions. 3 operations. Lead operation: Acadia List Work Instructions. Self-contained
    Naftiko capability covering one Acadia business surface.'
  tags:
  - Acadia
  - Work Instructions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ACADIA_API_KEY: ACADIA_API_KEY
capability:
