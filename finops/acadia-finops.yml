description: FOCUS-aligned FinOps scaffold for Acadia (now an Epicor product). Pricing is enterprise
  quote-based, so meters and FOCUS columns reflect a typical SaaS seat-and-tenant invoice rather than
  per-call usage.
sources:
  - https://www.acadia-software.com/
notes: No public pricing or billing API. The FinOps shape below assumes a SaaS subscription with seat-based
  metering, which is the canonical Acadia / Epicor commercial model; specific dollar amounts and committed-use
  terms must be reconciled from the customer's order form.
billingModel:
  pricingCategory: Subscription
  billingFrequency: Annual
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Usage
focusColumns:
  ServiceName: Acadia
  ServiceCategory: Connected Worker / Workforce Enablement SaaS
  ProviderName: Acadia
  PublisherName: Epicor Software Corporation
  InvoiceIssuerName: Epicor Software Corporation
  BillingCurrency: USD
  ChargeCategory: Purchase
meters:
  - name: named_user_seat
    description: Named-user seat assigned to a frontline worker, supervisor, or admin.
    unit: seat
    aggregation: max
    dimensions:
      - role
      - site
      - business_unit
  - name: tenant_subscription
    description: Annual platform subscription per tenant.
    unit: year
    aggregation: sum
    dimensions:
      - environment
  - name: api_request
    description: Acadia Platform API call (when the API add-on is contracted).
    unit: request
    aggregation: sum
    dimensions:
      - endpoint
      - integration
principles:
  - name: Visibility
    description: Acadia / Epicor invoices are line-item PDFs; pull seat counts and integration add-ons
      from the order form into the cost dataset since there is no public usage API.
  - name: Allocation
    description: Allocate seats to the consuming site, plant, or business unit; tag platform-API calls
      to the integrating system (ERP, HRIS, LMS).
  - name: Optimization
    description: Reconcile named-user seats annually against active workforce; reclaim seats from churned
      employees and align tier (read-only vs authoring) to actual usage.
  - name: Accountability
    description: Operations leadership at the consuming site owns seat counts and renewal scope; integrations
      are owned by the IT integration lead.
